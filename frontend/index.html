<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <link rel="manifest" href="/manifest.webmanifest">
        <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
        <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
        <meta name="theme-color" content="#ffffff">
        <script>
            // Restore before the first paint, including the login screen.
            try {
                const dark = localStorage.getItem('minhas-financas.theme') === 'dark';
                document.documentElement.classList.toggle('dark', dark);
                document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
                document.querySelector('meta[name="theme-color"]').content = dark ? '#151f33' : '#ffffff';
            } catch { /* Default to the approved light theme. */ }
        </script>
        <meta name="description" content="Controle suas finanças com simplicidade.">
        <title>Minhas Finanças</title>
    </head>
    <body>
        <svg class="icon-definitions" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
            <symbol id="icon-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m4 7 8 6 8-6"/></symbol>
            <symbol id="icon-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2"/></symbol>
            <symbol id="icon-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
            <symbol id="icon-eye-off" viewBox="0 0 24 24"><path d="m3 3 18 18M10.6 5.1A11 11 0 0 1 12 5c6.5 0 10 7 10 7a19 19 0 0 1-3.2 4M6.2 6.2A21 21 0 0 0 2 12s3.5 7 10 7a12 12 0 0 0 5-1.2M10 10a3 3 0 0 0 4 4"/></symbol>
            <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6"/></symbol>
            <symbol id="icon-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v6m0 3h.01"/></symbol>
            <symbol id="icon-check" viewBox="0 0 24 24"><path d="m5 12 4.5 4.5L19 7"/></symbol>
        </svg>
        <div id="app">
            <div id="auth-view" class="view view-main">
                <div class="page auth-page" data-name="login">
                    <div class="page-content auth-scroll">
                        <main class="auth-shell">
                            <div class="auth-waves" aria-hidden="true">
                                <svg viewBox="0 0 1000 300" preserveAspectRatio="none"><path d="M0 85C180 10 255 285 480 180S800-15 1000 95V300H0Z" fill="currentColor"/><path d="M0 210C200 10 285 245 485 230S770 25 1000 195" fill="none" stroke="white" stroke-width="3"/></svg>
                            </div>
                            <header class="auth-brand">
                                <svg class="brand-mark" viewBox="0 0 120 120" role="img" aria-label="Minhas Finanças">
                                    <defs><linearGradient id="brand-gradient" x1="0" y1="0" x2=".6" y2="1"><stop stop-color="#247aff"/><stop offset="1" stop-color="#0844e9"/></linearGradient></defs>
                                    <rect x="2" y="2" width="116" height="116" rx="29" fill="url(#brand-gradient)"/>
                                    <g fill="white"><rect x="30" y="63" width="14" height="23" rx="5"/><rect x="52" y="46" width="14" height="36" rx="5"/><rect x="74" y="29" width="14" height="45" rx="5"/></g>
                                    <path d="M12 94c31 18 55-26 96-15" fill="none" stroke="#bddeff" stroke-width="2.3" stroke-linecap="round"/>
                                </svg>
                                <h1>Minhas Finanças</h1>
                                <p>Controle suas finanças com simplicidade</p>
                            </header>

                            <section id="auth-loading" class="auth-loading" role="status">
                                <span class="mf-spinner" aria-hidden="true"></span>
                                <span>Preparando seu acesso...</span>
                            </section>

                            <section id="login-panel" class="auth-panel" aria-label="Acessar sua conta" hidden>
                                <form id="login-form" class="login-form">
                                    <fieldset id="login-fields" class="login-fields">
                                        <legend class="sr-only">Dados de acesso</legend>
                                        <div class="auth-field-group">
                                        <div class="auth-field">
                                            <svg class="mf-icon field-icon" aria-hidden="true"><use href="#icon-mail"/></svg>
                                            <div class="field-content">
                                                <label for="login-email">E-mail</label>
                                                <input id="login-email" name="email" type="email" placeholder="seu@email.com" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false" maxlength="254" required aria-describedby="email-error">
                                            </div>
                                            <svg class="mf-icon field-validation-icon" aria-hidden="true"><use id="email-validation-icon" href="#icon-alert"/></svg>
                                        </div>
                                        <div id="email-error" class="field-error" aria-live="polite" hidden></div>
                                        </div>
                                        <div class="auth-field-group">
                                        <div class="auth-field">
                                            <svg class="mf-icon field-icon" aria-hidden="true"><use href="#icon-lock"/></svg>
                                            <div class="field-content">
                                                <label for="login-password">Senha</label>
                                                <input id="login-password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required aria-describedby="password-error">
                                            </div>
                                            <button id="password-toggle" class="password-toggle" type="button" aria-label="Mostrar senha" aria-controls="login-password" aria-pressed="false">
                                                <svg class="mf-icon" aria-hidden="true"><use id="password-icon" href="#icon-eye-off"/></svg>
                                            </button>
                                            <svg class="mf-icon field-validation-icon" aria-hidden="true"><use id="password-validation-icon" href="#icon-alert"/></svg>
                                        </div>
                                        <div id="password-error" class="field-error" aria-live="polite" hidden></div>
                                        </div>
                                        <div class="login-options">
                                            <label class="remember-control">
                                                <input id="login-remember" name="remember" type="checkbox">
                                                <span class="remember-box" aria-hidden="true"><svg class="mf-icon"><use href="#icon-check"/></svg></span>
                                                <span>Lembrar de mim</span>
                                            </label>
                                        </div>
                                        <p id="auth-error" class="auth-error" role="alert" tabindex="-1" hidden></p>
                                        <button id="login-submit" class="mf-button mf-button-primary" type="submit">
                                            <span id="login-label">Entrar</span>
                                            <svg id="login-arrow" class="mf-icon" aria-hidden="true"><use href="#icon-arrow"/></svg>
                                            <span id="login-spinner" class="mf-spinner" aria-hidden="true" hidden></span>
                                        </button>
                                    </fieldset>
                                </form>
                            </section>

                            <footer class="auth-footer"><span class="footer-rule" aria-hidden="true"></span><p>Acesse seu controle financeiro pessoal</p></footer>
                        </main>
                    </div>
                </div>
            </div>
            <div id="workspace" class="workspace" hidden>
                <div id="finance-view" class="view"></div>
                <div class="toolbar toolbar-bottom workspace-toolbar">
                    <nav class="toolbar-inner workspace-nav" aria-label="Navegação principal">
                        <a class="nav-link external" href="/inicio/" data-section="inicio"><i class="f7-icons" aria-hidden="true">house_fill</i><span>Início</span></a>
                        <a class="nav-link external" href="/orcamentos/" data-section="orcamentos"><i class="f7-icons" aria-hidden="true">money_dollar_circle_fill</i><span>Orçamento</span></a>
                        <button id="new-transaction" class="new-transaction" type="button" aria-label="Novo lançamento"><span class="new-transaction-circle"><i class="f7-icons" aria-hidden="true">plus</i></span><span>Lançar</span></button>
                        <a class="nav-link external" href="/objetivos/" data-section="objetivos"><i class="f7-icons" aria-hidden="true">checkmark_alt_circle_fill</i><span>Objetivos</span></a>
                        <a class="nav-link external" href="/mais/" data-section="mais"><i class="f7-icons" aria-hidden="true">square_grid_2x2_fill</i><span>Mais</span></a>
                    </nav>
                </div>
            </div>
        </div>
        <script type="module" src="/src/js/app.js"></script>
    </body>
</html>
