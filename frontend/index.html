<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <meta name="theme-color" content="#2463EB" />
        <title>Minhas Finanças</title>
    </head>
    <body>
        <div id="app">
            <div class="view view-main">
                <div class="page" data-name="foundation">
                    <div class="navbar">
                        <div class="navbar-inner">
                            <div class="title">Minhas Finanças</div>
                        </div>
                    </div>

                    <div class="page-content">
                        <div class="block">
                            <h1>Fundação do frontend</h1>
                            <p>Sprint 0 — teste do Framework7 Core.</p>

                            <button
                                id="test-framework"
                                type="button"
                                class="button button-fill button-large"
                            >
                                Testar interface
                            </button>

                            <h2>Teste de gráfico</h2>
                            <p>Dados fictícios para validação técnica.</p>

                            <div
                                id="test-chart"
                                role="img"
                                aria-label="Gráfico de teste: entradas de 300 reais e saídas de 200 reais"
                                style="width: 100%; height: 280px"
                            ></div>

                            <h2>Teste de autenticação</h2>

                            <form id="login-form">
                                <div class="list">
                                    <ul>
                                        <li class="item-content item-input">
                                            <div class="item-inner">
                                                <label
                                                    class="item-title item-label"
                                                    for="login-email"
                                                >
                                                    E-mail
                                                </label>
                                                <div class="item-input-wrap">
                                                    <input
                                                        id="login-email"
                                                        type="email"
                                                        autocomplete="username"
                                                        required
                                                    />
                                                </div>
                                            </div>
                                        </li>

                                        <li class="item-content item-input">
                                            <div class="item-inner">
                                                <label
                                                    class="item-title item-label"
                                                    for="login-password"
                                                >
                                                    Senha
                                                </label>
                                                <div class="item-input-wrap">
                                                    <input
                                                        id="login-password"
                                                        type="password"
                                                        autocomplete="current-password"
                                                        required
                                                    />
                                                </div>
                                            </div>
                                        </li>
                                    </ul>
                                </div>

                                <button
                                    id="login-submit"
                                    type="submit"
                                    class="button button-fill"
                                >
                                    Entrar
                                </button>
                            </form>

                            <p>
                                <button
                                    id="check-session"
                                    type="button"
                                    class="button"
                                >
                                    Consultar sessão
                                </button>
                            </p>

                            <p>
                                <button
                                    id="logout-button"
                                    type="button"
                                    class="button"
                                >
                                    Sair
                                </button>
                            </p>

                            <p
                                id="auth-status"
                                role="status"
                                aria-live="polite"
                            ></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script type="module" src="/src/js/app.js"></script>
    </body>
</html>
